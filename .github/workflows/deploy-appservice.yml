name: Deploy to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy App Service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm run test

      - name: Build
        # App Service hosts at site root — do not set GITHUB_PAGES base path
        run: npm run build && npm run build:server

      - name: Azure login (OIDC, no stored password)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check the site is configured before deploying
        # The server refuses to start without these, so fail here instead of taking the site down.
        run: |
          names=$(az webapp config appsettings list \
            --resource-group rg-copilotstudio-training --name copilotstudio-academy \
            --query "[].name" -o tsv)
          for required in AZURE_STORAGE_CONNECTION_STRING ADMIN_EMAILS ALLOWED_TENANT_ID; do
            echo "$names" | grep -qx "$required" || { echo "::error::App setting $required is missing"; exit 1; }
          done
          site_id=$(az webapp show \
            --resource-group rg-copilotstudio-training --name copilotstudio-academy --query id -o tsv)
          enabled=$(az rest --method get \
            --url "https://management.azure.com${site_id}/config/authsettingsV2?api-version=2023-12-01" \
            --query "properties.platform.enabled" -o tsv)
          [ "$enabled" = "true" ] || { echo "::error::App Service Authentication is not turned on"; exit 1; }

      - name: Package and deploy to Azure Web App
        run: |
          zip -qr "$RUNNER_TEMP/site.zip" dist server-dist
          az webapp config set \
            --resource-group rg-copilotstudio-training \
            --name copilotstudio-academy \
            --startup-file "node /home/site/wwwroot/server-dist/index.mjs"
          az webapp deploy \
            --resource-group rg-copilotstudio-training \
            --name copilotstudio-academy \
            --type zip \
            --clean true \
            --src-path "$RUNNER_TEMP/site.zip"
