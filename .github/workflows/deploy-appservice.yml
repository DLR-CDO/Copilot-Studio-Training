name: Deploy to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy App Service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm run test

      - name: Build
        # App Service hosts at site root — do not set GITHUB_PAGES base path
        run: npm run build

      - name: Azure login (OIDC, no stored password)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Package and deploy to Azure Web App
        run: |
          (cd dist && zip -qr "$RUNNER_TEMP/site.zip" .)
          az webapp deploy \
            --resource-group rg-copilotstudio-training \
            --name copilotstudio-academy \
            --type zip \
            --src-path "$RUNNER_TEMP/site.zip"
